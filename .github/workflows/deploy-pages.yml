name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-primary.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy (first attempt)
        id: deploy-primary
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (retry)
        id: deploy-retry
        if: steps.deploy-primary.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Fail job when both deploy attempts fail
        if: steps.deploy-primary.outcome == 'failure' && steps.deploy-retry.outcome == 'failure'
        run: exit 1
